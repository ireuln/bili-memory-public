<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>B-Impression · Settings</title>
<style>
  :root {
    --bg: #0d1014; --panel: #141920; --panel2: #181e27; --line: #232b36;
    --fg: #dbe4ee; --muted: #7d8896; --dim: #5b6572;
    --accent: #4da3ff; --accent-dim: #1d3a5c;
    --ok: #3ddc84; --warn: #ffb020; --bad: #ff5c5c;
    --nav: 186px; --radius: 8px;
  }
  :root[data-theme="light"] {
    --bg: #f4f6f8; --panel: #ffffff; --panel2: #f7f9fb; --line: #e2e7ec;
    --fg: #17202a; --muted: #66737f; --dim: #98a2ad;
    --accent: #1f6feb; --accent-dim: #dbe8fb;
    --ok: #1a9c55; --warn: #b26a00; --bad: #c0392b;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f6f8; --panel: #ffffff; --panel2: #f7f9fb; --line: #e2e7ec;
      --fg: #17202a; --muted: #66737f; --dim: #98a2ad;
      --accent: #1f6feb; --accent-dim: #dbe8fb;
      --ok: #1a9c55; --warn: #b26a00; --bad: #c0392b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.55 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  .mono { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-variant-numeric: tabular-nums; }

  .app { display: grid; grid-template-columns: var(--nav) 1fr; grid-template-rows: 48px 1fr; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px;
           padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header .logo { width: 9px; height: 9px; border-radius: 2px; background: var(--accent); }
  header h1 { margin: 0; font-size: 13.5px; font-weight: 600; letter-spacing: .2px; }
  header .sub { color: var(--dim); font-size: 12px; }
  header .sp { flex: 1; }
  .search { width: 210px; background: var(--panel2); border: 1px solid var(--line); color: var(--fg);
            border-radius: 6px; padding: 5px 9px; font: inherit; font-size: 12.5px; outline: none; }
  .search:focus { border-color: var(--accent); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }

  nav { border-right: 1px solid var(--line); background: var(--panel); padding: 10px 8px; overflow-y: auto; }
  nav button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
               background: transparent; border: 0; color: var(--muted); font: inherit;
               padding: 7px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 2px; }
  nav button:hover { background: var(--panel2); color: var(--fg); }
  nav button.on { background: var(--accent-dim); color: var(--fg); }
  nav button .ic { width: 14px; text-align: center; color: var(--dim); font-size: 12px; }
  nav button.on .ic { color: var(--accent); }
  nav .navfoot { margin-top: 18px; padding: 8px 10px; color: var(--muted); font-size: 11.5px; line-height: 1.6; }

  main { overflow-y: auto; padding: 18px 26px 60px; }
  .sec { display: none; max-width: 860px; }
  .sec.on { display: block; }
  .sechead { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  .secedesc { color: var(--muted); font-size: 12.5px; margin-bottom: 16px; }

  .grp { margin: 0 0 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); overflow: hidden; }
  .grp > h3 { margin: 0; padding: 10px 14px; font-size: 12.5px; font-weight: 600; color: var(--muted);
              border-bottom: 1px solid var(--line); background: var(--panel2); letter-spacing: .3px; }
  .grp > .gdesc { padding: 8px 14px 0; color: var(--dim); font-size: 12px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 11px 14px; border-top: 1px solid var(--line); }
  .grp > .row:first-of-type, .grp > .gdesc + .row { border-top: 0; }
  .row:hover { background: var(--panel2); }
  .row .meta { flex: 1; min-width: 0; }
  .row .lbl { font-weight: 500; display: flex; align-items: center; gap: 7px; }
  .row .dsc { color: var(--muted); font-size: 12px; margin-top: 1px; }
  .row .ctl { display: flex; align-items: center; gap: 9px; flex: none; }
  .row .st { font-size: 11.5px; min-width: 64px; text-align: right; color: var(--muted); }
  .row .st.saving { color: var(--accent); }
  .row .st.saved { color: var(--ok); }
  .row .st.err { color: var(--bad); }
  .row.err { box-shadow: inset 2px 0 0 var(--bad); }

  .tog { position: relative; width: 36px; height: 20px; flex: none; }
  .tog input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
  .tog span { position: absolute; inset: 0; background: var(--line); border-radius: 4px; transition: .12s; }
  .tog span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
                     background: var(--dim); border-radius: 3px; transition: .12s; }
  .tog input:checked + span { background: var(--accent-dim); }
  .tog input:checked + span::after { transform: translateX(16px); background: var(--accent); }
  .num { width: 88px; background: var(--panel2); border: 1px solid var(--line); color: var(--fg);
         border-radius: 5px; padding: 4px 7px; font: inherit; font-size: 12.5px; text-align: right; }
  .num:focus, .txt:focus { border-color: var(--accent); outline: none; }
  .txt { width: 220px; background: var(--panel2); border: 1px solid var(--line); color: var(--fg);
         border-radius: 5px; padding: 4px 7px; font: inherit; font-size: 12.5px; }
  .sel { background: var(--panel2); border: 1px solid var(--line); color: var(--fg);
         border-radius: 5px; padding: 4px 7px; font: inherit; font-size: 12.5px; }
  .unit { color: var(--dim); font-size: 11.5px; min-width: 28px; }

  .badge { font-size: 11px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
  .badge.ready, .badge.running { color: var(--ok); border-color: currentColor; }
  .badge.disabled, .badge.missing { color: var(--bad); border-color: currentColor; }

  .btn { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel2);
         color: var(--fg); border-radius: 6px; padding: 6px 13px; font-size: 12.5px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn[disabled] { opacity: .55; cursor: default; }

  .tasks-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .tasks-head .note { color: var(--muted); font-size: 12px; flex: 1; }
  .pending { color: var(--warn); }
  .warnline { margin-top: 4px; font-size: 11.5px; line-height: 1.45; color: var(--warn); }
  .warnline.bad { color: var(--bad); font-weight: 600; }
  .helpp { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-top: 8px; background: var(--panel2); }
  .helpp .phead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .helpp pre { margin: 6px 0 0; white-space: pre-wrap; font: inherit; font-size: 12.5px; line-height: 1.55; color: var(--fg); }
  .helpl { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; line-height: 1.65; }
  .helpl li { margin-top: 4px; }
  .kv { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 12.5px; }
  .kv:first-of-type { border-top: 0; }
  .kv span { color: var(--muted); }
  .shot { border: 1px solid var(--bad); border-radius: 8px; padding: 10px 14px; margin-top: 8px; background: rgba(255,92,92,.07); }
  .shot .gmeta { font-size: 11.5px; color: var(--muted); }
  .shot .gmsg { margin-top: 3px; font-size: 12.5px; line-height: 1.5; color: var(--fg); }
  .badge.on { color: var(--ok); border-color: currentColor; }
  pre.cmd { margin: 8px 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); font-size: 12px; line-height: 1.5; white-space: pre-wrap; }

  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; color: var(--muted); font-weight: 500; font-size: 11.5px;
             padding: 7px 14px; border-bottom: 1px solid var(--line); }
  tbody td { padding: 9px 14px; border-top: 1px solid var(--line); }
  tbody tr:hover { background: var(--panel2); }
  td.r { text-align: right; }
  .skel { height: 13px; border-radius: 3px; background: linear-gradient(90deg, var(--panel2), var(--line), var(--panel2));
          background-size: 200% 100%; animation: sk 1.2s linear infinite; }
  @keyframes sk { to { background-position: -200% 0; } }

  .kpi { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .kpi .k { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 10px 13px; }
  .kpi .k .v { font-size: 19px; font-weight: 600; }
  .kpi .k .t { color: var(--muted); font-size: 11.5px; }
  .dlist .drow { display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-top: 1px solid var(--line); }
  .dlist .drow:first-child { border-top: 0; }
  .cover { width: 64px; height: 40px; border-radius: 4px; object-fit: cover; background: var(--panel2); flex: none; }
  .cover.ph { display: block; border: 1px dashed var(--line); }
  .dmeta { flex: 1; min-width: 0; }
  .dt { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dd { color: var(--muted); font-size: 11.5px; }
  .dtags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .dtag { font-size: 10.5px; color: var(--muted); background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; line-height: 1.7; }
  .dtime { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .dlink { color: var(--muted); font-size: 11.5px; text-decoration: none; white-space: nowrap; }
  .dlink:hover { color: var(--accent); }
  .empty { color: var(--muted); padding: 18px 14px; font-size: 12.5px; }

  .chk { display: inline-flex; align-items: center; gap: 5px; margin-right: 10px; font-size: 12.5px; color: var(--fg); }
  .mini { display: inline-block; width: 90px; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; vertical-align: middle; }
  .mini i { display: block; height: 100%; background: var(--accent); }
  .hdwall { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 10px; }
  .hdwall .hd { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel2); }
  .hdwall img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; }
  .hdwall figcaption { font-size: 10.5px; color: var(--muted); padding: 4px 6px; line-height: 1.35; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 48px auto 1fr; }
    nav { display: flex; overflow-x: auto; overflow-y: hidden; border-right: 0; border-bottom: 1px solid var(--line); padding: 4px; }
    nav button { width: auto; white-space: nowrap; margin-bottom: 0; }
    nav .navfoot { display: none; }
    header { gap: 8px; padding: 0 10px; }
    header .sub { display: none; }
    .search { width: auto; flex: 1; min-width: 80px; }
    main { padding: 12px 12px 40px; }
    .sec { max-width: none; }
    .kpi { grid-template-columns: repeat(2, 1fr); }
    .kpi .k { padding: 8px 10px; }
    .row { flex-wrap: wrap; }
    .row .ctl { flex: 1 1 100%; flex-wrap: wrap; }
    .row .st { min-width: 0; }
    .tasks-head { flex-wrap: wrap; }
    .dlist .drow { flex-wrap: wrap; }
    .dlist .dmeta { flex: 1 1 100%; order: 2; }
    .dlist .cover { order: 1; }
    .dlist .dtime, .dlist .dlink { order: 3; }
    table { display: block; overflow-x: auto; }
  }

  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 9;
           background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
           padding: 8px 16px; font-size: 12.5px; box-shadow: 0 8px 26px rgba(0,0,0,.35); display: none; }
  #toast.show { display: block; }
  #toast.ok { border-color: var(--ok); color: var(--ok); }
  #toast.err { border-color: var(--bad); color: var(--bad); }
  .flist .frow { display: flex; align-items: center; gap: 12px; padding: 12px 14px;
                 border-top: 1px solid var(--line); background: var(--panel); }
  .flist .frow:first-child { border-top: 0; }
  .flist .frow.dragging { opacity: .45; }
  .flist .frow.over { box-shadow: inset 0 2px 0 var(--accent); }
  .grip { cursor: grab; color: var(--dim); font-size: 13px; user-select: none; line-height: 1; }
  .fname { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fmeta { color: var(--muted); font-size: 11.5px; flex: none; }
  .flist .sel { flex: none; min-width: 118px; }
  .fnote { color: var(--muted); font-size: 12px; margin-top: 10px; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="logo"></span>
    <h1>B印象</h1><span class="sub">设置</span>
    <span class="sp"></span>
    <input class="search" id="q" placeholder="Search settings..." autocomplete="off">
    <span class="dot" id="health" title="服务状态"></span>
  </header>
  <nav id="nav"><div class="navfoot">改动即时保存<br>计划任务在「定时任务」里应用</div></nav>
  <main id="main"></main>
</div>
<div id="toast"></div>

  const txt = await r.text();
  let j = null;
  try { j = JSON.parse(txt); } catch (e) { j = { ok: false, error: 'bad response' }; }
  if (!r.ok) throw Object.assign(new Error(j.error || ('HTTP ' + r.status)), { body: j });
  return j;
}
function toast(msg, ok) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + (ok ? 'ok' : 'err');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.className = ''; }, 4500);
}

/* ---------- control value plumbing ---------- */
function ctlValue(el) {
  const kind = el.dataset.kind;
  if (kind === 'automation') return el.checked ? 'scheduled' : 'manual';
  if (kind === 'bool') return el.checked;
  if (kind === 'int') return el.value === '' ? 0 : Number(el.value);
  return el.value;
}
function syncCtl(el, v) {
  const kind = el.dataset.kind;
  if (kind === 'automation') el.checked = (v === 'scheduled');
  else if (kind === 'bool') el.checked = !!v;
  else if (kind === 'int') el.value = (v == null ? '' : v);
  else el.value = fmtVal(v);
}
function setRowState(row, cls, text) {
  row.classList.remove('saving', 'saved', 'err');
  const st = row.querySelector('.st');
  if (cls) row.classList.add(cls);
  if (st) { st.className = 'st' + (cls ? ' ' + cls : ''); st.textContent = text || ''; }
}
async function saveKey(key, value, row, el) {
  setRowState(row, 'saving', T('保存中…'));
  try {
    const r = await api('/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key, value })
    });
    if (!r.ok) throw new Error(r.error || T('保存失败'));
    setRowState(row, 'saved', T('已保存'));
    setTimeout(() => { if (row.classList.contains('saved')) setRowState(row, '', ''); }, 1600);
    if (key.startsWith('Automation.') || key.startsWith('Schedule.') || key === 'Sampling') { S.pending.add(key); refreshPending(); }
    refreshWarns();
  } catch (e) {
    setRowState(row, 'err', e.message);
    row.classList.add('err');
    if (el) syncCtl(el, getProp(S.config, key));
    toast(e.message, false);
  }
}

/* ---------- item rendering ---------- */
function refreshWarns() {
  document.querySelectorAll('[data-warn="Sampling"]').forEach(el => {
    const v = Number(getProp(S.config, 'Sampling')) || 0;
    if (v <= 0) { el.textContent = T('当前：关闭'); el.className = 'warnline'; return; }
    const per = Math.floor(1440 / v);
    if (v < 15) {
      el.textContent = '高风险：每 ' + v + ' 分钟采集一次（约 ' + per + T(' 次/天），可能触发限流或登录态失效');
      el.className = 'warnline bad';
    } else {
      el.textContent = '每 ' + v + ' 分钟采集一次（约 ' + per + ' 次/天）';
      el.className = 'warnline';
    }
  });
}
function itemRow(it) {
  let v = getProp(S.config, it.key);
  if (v == null && it.default != null) v = it.default;
  const blob = JSON.stringify({ key: it.key, label: it.label, desc: it.desc || '', type: it.type }).toLowerCase();
  const searchable = blob.includes(S.query.toLowerCase()) || !S.query;
  let ctl = '';
  if (it.type === 'automation' || it.type === 'bool') {
    const on = it.type === 'automation' ? (v === 'scheduled') : !!v;
    ctl = `<label class="tog"><input type="checkbox" data-key="${esc(it.key)}" data-kind="${esc(it.type)}" ${on ? 'checked' : ''}><span></span></label>`;
  } else if (it.type === 'int') {
    ctl = `<input type="number" class="num" data-key="${esc(it.key)}" data-kind="int" value="${esc(v == null ? '' : v)}" ${it.min != null ? 'min="' + it.min + '"' : ''} ${it.max != null ? 'max="' + it.max + '"' : ''}>` +
          (it.unit ? `<span class="unit">${esc(T(it.unit))}</span>` : '');
  } else if (it.type === 'enum') {
    ctl = `<select class="sel" data-key="${esc(it.key)}" data-kind="enum">` +
      (it.values || []).map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('') + '</select>';
  } else if (it.type === 'time') {
    ctl = `<input type="time" class="txt" data-key="${esc(it.key)}" data-kind="time" value="${esc(v || '')}">`;
  } else if (it.type === 'text' || it.type === 'list') {
    ctl = `<input type="text" class="txt" data-key="${esc(it.key)}" data-kind="${esc(it.type)}" value="${esc(fmtVal(v))}">`;
  }
  return `<div class="row ${searchable ? '' : 'hidden'}" data-row="${esc(it.key)}">
    <div class="meta"><div class="lbl">${esc(PT(it, 'label'))}</div><div class="dsc">${esc(PT(it, 'desc'))}</div>${it.key === 'Sampling' ? '<div class="warnline" data-warn="Sampling"></div>' : ''}</div>
    <div class="ctl">${ctl}</div><div class="st"></div>
  </div>`;
}
function groupBlock(g) {
  const rows = (g.items || []).map(itemRow).join('');
  if (!rows) return '';
  return `<section class="grp"><h3>${esc(PT(g, 'title'))}</h3>${g.desc ? `<div class="gdesc">${esc(PT(g, 'desc'))}</div>` : ''}${rows}</section>`;
}
function bindControls(root) {
  root.querySelectorAll('[data-key]').forEach(el => {
    const key = el.dataset.key;
    const row = el.closest('[data-row]');
    if (el.dataset.kind === 'int' || el.dataset.kind === 'text' || el.dataset.kind === 'list') {
      let timer = 0;
      el.oninput = () => { clearTimeout(timer); timer = setTimeout(() => { S.config = patchLocal(key, ctlValue(el)); saveKey(key, ctlValue(el), row, el); }, 600); };
      el.onchange = () => { clearTimeout(timer); S.config = patchLocal(key, ctlValue(el)); saveKey(key, ctlValue(el), row, el); };
    } else {
      el.onchange = () => { S.config = patchLocal(key, ctlValue(el)); saveKey(key, ctlValue(el), row, el); };
    }
  });
}
function patchLocal(key, value) {
  const segs = key.split('.');
  const root = JSON.parse(JSON.stringify(S.config));
  let cur = root;
  for (let i = 0; i < segs.length - 1; i++) { if (!cur[segs[i]]) cur[segs[i]] = {}; cur = cur[segs[i]]; }
  cur[segs[segs.length - 1]] = value;
  return root;
}

function renderSection() {
  if (!S.schema) return;
  if (S.section === 'overview') { renderOverview(); return; }
  if (S.section === 'tasks') { renderTasks(); return; }
  if (S.section === 'deleted') { renderDeleted(); return; }
  if (S.section === 'folders') { renderFolders(); return; }
  if (S.section === 'watch') { renderWatch(); return; }
  if (S.section === 'share') { renderShare(); return; }
  if (S.section === 'help') { renderHelp(); return; }
  const sec = (S.schema.sections || []).find(s => s.id === S.section);
  if (!sec) return;
  const groups = (sec.groups || []).map(groupBlock).join('');
  main.innerHTML = `<div class="sec on"><div class="sechead">${esc(PT(sec, 'title'))}</div><div class="secedesc">${esc(PT(sec, 'desc'))}</div>${groups}<div class="empty">${T('改动即时保存；采集类改动在下一轮采集生效。')}</div></div>`;

}

function renderOverview() {

  const today = hist[0] || { runs: 0, ok: 0, fail: 0, added: 0 };
  const week = hist.slice(0, 7).reduce((a, d) => ({ added: a.added + d.added, ok: a.ok + d.ok, fail: a.fail + d.fail }), { added: 0, ok: 0, fail: 0 });

  const running = (tasks || []).some(t => t.state === 'Running');

function backupTargetsBlock(targets) {
  const t = targets || [];
  const pathOf = kind => { const hit = t.find(x => x.kind === kind); return hit ? hit.path : ''; };
  return `<section class="grp"><h3>备份目标</h3>
    <div class="row"><div class="meta"><div class="lbl">主目标</div><div class="dsc">归档备份的主落地目录（本机磁盘）</div></div>
      <div class="ctl"><input class="txt btpath" data-kind="primary" value="${esc(pathOf('primary'))}"></div><div class="st"></div></div>
    <div class="row"><div class="meta"><div class="lbl">镜像目标</div><div class="dsc">第二个落地目录（移动盘 / 网盘同步目录）；留空表示不用镜像</div></div>
      <div class="ctl"><input class="txt btpath" data-kind="mirror" value="${esc(pathOf('mirror'))}"></div><div class="st"></div></div>
    <div style="margin-top:12px"><button class="btn" id="bt-save">保存备份目标</button></div>
  </section>`;
}
function bindBackupTargets(root) {
  const btn = root.querySelector('#bt-save');
  if (!btn) return;
  btn.onclick = async () => {
    const targets = [];
    root.querySelectorAll('.btpath').forEach(el => {
      const p = (el.value || '').trim();
      if (p) targets.push({ path: p, kind: el.dataset.kind });
    });
    if (!targets.length) { toast(T('至少填一个目标'), false); return; }
    btn.disabled = true; btn.textContent = T('保存中…');
    try {
      const r = await api('/api/backup-targets', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ targets }) });
      if (!r.ok) throw new Error(r.error || T('保存失败'));
      toast(T('备份目标已保存，下一次备份生效'), true);
    } catch (e) { toast(T('保存失败：') + e.message, false); }
    btn.disabled = false; btn.textContent = T('保存备份目标');
  };
}
async function renderTasks() {
  let targets = [];
  try { targets = (await api('/api/backup-targets')).targets || []; } catch (e) { targets = []; }
  const pending = S.pending.size > 0;
  const head = `<div class="tasks-head">
    <span class="note">来自 Windows 计划任务。开关在「采集范围」，时间与本页开关保存后才写进系统${pending ? '，<span class="pending">有改动未应用</span>' : ''}。</span>
    <button class="btn primary" id="apply">应用计划任务</button>
  </div>`;
  const table = `<section class="grp"><h3>任务</h3><table><thead><tr>
      <th>任务</th><th>状态</th><th>上次运行</th><th>下次运行</th><th>上次结果</th>
    </tr></thead><tbody>${(S.tasks || []).map(t => `<tr>
      <td>${esc(t.label)}</td>
      <td><span class="badge ${String(t.state).toLowerCase()}">${esc(t.installed ? t.state : T('未注册'))}</span></td>
      <td class="mono">${esc(t.lastRun || '—')}</td>
      <td class="mono">${esc(t.nextRun || '—')}</td>

    </tr>`).join('')}</tbody></table></section>`;

  const head = `<div class="sechead">已删除 <span style="font-size:12px;color:var(--muted)">（${esc(rangeLabel(S.deletedRange))}内 ${S.deletedTotal} 条${unknownNote}）</span></div>

    <div style="margin-bottom:12px">${rangeButtons()}</div>`;

  const rows = S.deleted || [];
  if (!rows.length) {
    main.innerHTML = `<div class="sec on">${head}<div class="empty">这个时间段内没有失效记录（或还没跑过收藏采集）。</div></div>`;

      ? `<img class="cover" loading="lazy" src="${esc(it.cover)}?t=${encodeURIComponent(token)}" alt="">`

const FAV_LEVELS = [
  { key: 'full', label: T('全量采集') },
  { key: 'daily', label: T('只每日增量') },
  { key: 'skip', label: T('完全不采集') }
];
async function loadFolders() {
  try { const r = await api('/api/folders'); S.folders = r.folders || []; S.folderOrderReady = !!r.orderReady; }
  catch (e) { S.folders = []; S.folderOrderReady = false; }
}
function renderFolders() {
  if (!S.folders) {
    main.innerHTML = '<div class="sec on"><div class="sechead">收藏夹</div><div class="empty">加载中…</div></div>';
    loadFolders().then(() => { if (S.section === 'folders') renderFolders(); });
    return;
  }
  if (!S.folders.length) {
    main.innerHTML = '<div class="sec on"><div class="sechead">收藏夹</div><div class="empty">还没有收藏夹数据——先跑一次收藏采集。</div></div>';
    return;
  }
  const rows = S.folders.map((f, i) => {
    const opts = FAV_LEVELS.map(l => '<option value="' + l.key + '"' + (f.level === l.key ? ' selected' : '') + '>' + l.label + '</option>').join('');
    const meta = LANG === 'en-US' ? f.count + ' items' + (f.invalid ? ' · ' + f.invalid + ' invalid' : '') : f.count + ' 条' + (f.invalid ? ' · 失效 ' + f.invalid : '');
    return '<div class="frow" draggable="true" data-i="' + i + '">' +
      '<span class="grip" title="拖动排序">⠿</span>' +
      '<span class="fname">' + esc(f.name) + '</span>' +
      '<span class="fmeta mono">' + meta + '</span>' +
      '<select class="sel" data-i="' + i + '">' + opts + '</select>' +
      '</div>';
  }).join('');
  main.innerHTML = '<div class="sec on"><div class="sechead">收藏夹</div>' +
    '<div class="secedesc">拖动左侧手柄调整采集先后；级别决定这个夹在哪些采集里出现。改动即时保存，下一轮采集生效。</div>' +
    '<div style="margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
      '<button class="btn" id="folders-api">按 B 站顺序重排</button>' +
      '<span class="dsc">' + (S.folderOrderReady ? T('B 站顺序来自上次收藏采集') : T('先跑一次收藏采集，才有 B 站顺序')) + '</span>' +
    '</div>' +
    '<section class="grp"><div class="flist">' + rows + '</div></section>' +
    '<div class="fnote">「完全不采集」的夹在每日增量和每周全量里都会跳过；「只每日增量」的夹不进每周全量。</div></div>';
  bindFolderRows();
  const apiBtn = document.getElementById('folders-api');
  if (apiBtn) apiBtn.onclick = async () => {
    try {
      const r = await api('/api/folders?order=api');
      if (!r.orderReady) { toast(T('还没有 B 站顺序文件：先跑一次收藏采集'), false); return; }
      S.folders = r.folders || [];
      await saveFolders(false);
      toast(T('已按 B 站顺序重排并保存'), true);
      renderFolders();
    } catch (e) { toast(T('重排失败：') + e.message, false); }
  };
}
function bindFolderRows() {
  const list = main.querySelector('.flist');
  if (!list) return;
  let dragFrom = -1;
  list.querySelectorAll('.frow').forEach(row => {
    row.addEventListener('dragstart', e => {
      dragFrom = Number(row.dataset.i);
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(dragFrom));
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      list.querySelectorAll('.frow').forEach(r => r.classList.remove('over'));
    });
    row.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      row.classList.add('over');
    });
    row.addEventListener('dragleave', () => row.classList.remove('over'));
    row.addEventListener('drop', e => {
      e.preventDefault();
      row.classList.remove('over');
      const to = Number(row.dataset.i);
      if (dragFrom < 0 || dragFrom === to) return;
      const arr = S.folders.slice();
      const moved = arr.splice(dragFrom, 1)[0];
      arr.splice(to, 0, moved);
      S.folders = arr;
      saveFolders(true);
      renderFolders();
    });
    const sel = row.querySelector('select');
    if (sel) sel.addEventListener('change', () => {
      const i = Number(sel.dataset.i);
      S.folders[i] = Object.assign({}, S.folders[i], { level: sel.value });
      saveFolders(true);
    });
  });
}
async function saveFolders(msg) {
  const plan = (S.folders || []).map(f => ({ name: f.name, level: f.level }));
  try {
    const r = await api('/api/folders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ plan: plan })
    });
    if (!r.ok) throw new Error(r.error || T('保存失败'));
    if (msg) toast(T('收藏夹设置已保存'), true);
  } catch (e) {
    toast(T('收藏夹保存失败：') + e.message, false);
    await loadFolders();
    renderFolders();
  }
}

function historyTable(rows, compact) {
  if (!rows || !rows.length) return `<div class="empty">最近 30 天没有采集日志。</div>`;
  const max = Math.max(1, ...rows.map(r => r.added));
  return `<table><thead><tr><th>日期</th><th class="r">尝试</th><th class="r">成功</th><th class="r">失败</th><th class="r">新增</th><th>趋势</th></tr></thead><tbody>` +
    rows.map(r => {
      const rate = r.runs ? Math.round(100 * r.ok / r.runs) : 0;
      const w = Math.round(100 * r.added / max);
      return `<tr><td class="mono">${esc(r.date)}</td><td class="r mono">${r.runs}</td><td class="r mono">${r.ok}${r.runs ? ' · ' + rate + '%' : ''}</td><td class="r mono"${r.fail ? ' style="color:var(--bad)"' : ''}>${r.fail}</td><td class="r mono">${r.added}</td><td><span class="mini"><i style="width:${w}%"></i></span></td></tr>`;
    }).join('') + `</tbody></table>`;
}

/* ---------- search ---------- */
q.addEventListener('input', () => {
  S.query = q.value.trim();
  if (!S.query) { renderSection(); return; }
  const secs = S.schema.sections.filter(s => s.groups);
  const blocks = [];
  for (const s of secs) {
    for (const g of (s.groups || [])) {
      for (const it of (g.items || [])) {
        const hay = (PT(it, 'label') + ' ' + PT(it, 'desc') + ' ' + it.key + ' ' + PT(g, 'title') + ' ' + PT(s, 'title')).toLowerCase();
        if (hay.includes(S.query.toLowerCase())) {
          blocks.push(`<section class="grp"><h3>${esc(PT(s, 'title'))} / ${esc(PT(g, 'title'))}</h3>${itemRow(it)}</section>`);
        }
      }
    }
  }
  main.innerHTML = `<div class="sec on"><div class="sechead">搜索</div><div class="secedesc">“${esc(S.query)}” ${blocks.length} 个结果</div>${blocks.join('') || '<div class="empty">没有匹配项。</div>'}</div>`;
  bindControls(main);
});

/* ---------- boot ---------- */
async function loadSlow() {
  // Run the slow endpoints in parallel so the first screen never waits on the
  // log scan or the scheduled-task queries.
  const [tasksRes, histRes] = await Promise.allSettled([api('/api/tasks'), api('/api/history')]);
  S.tasks = tasksRes.status === 'fulfilled' ? tasksRes.value.tasks : [];
  S.history = histRes.status === 'fulfilled' ? histRes.value.days : [];
  await Promise.all([loadDeleted(S.deletedRange), loadFolders()]);
  if (['overview', 'tasks', 'deleted', 'folders'].includes(S.section) && !S.query) renderSection();
}

async function boot() {
  try {
    const c = await api('/api/config');
    S.schema = c.schema; S.config = c.config;
    LANG = (c.config.UiLanguage === 'en-US') ? 'en-US' : 'zh-CN';
    applyStaticI18n();
    const hash = (location.hash || '').replace('#', '');
    if (hash) S.section = hash;
    const mo = new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) translateDom(n); });
    mo.observe(main, { childList: true, subtree: true });
    const toastEl = document.getElementById('toast');
    if (toastEl) mo.observe(toastEl, { childList: true, characterData: true, subtree: true });
    renderNav();
    renderSection();
    loadSlow();
  } catch (e) {
    main.innerHTML = `<div class="sec on"><div class="empty">无法连接设置服务：${esc(e.message)}</div></div>`;
  }
}
boot();
</script>
